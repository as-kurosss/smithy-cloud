services:
  postgres:
    image: postgres:16-alpine
    container_name: smithy-cloud-db
    environment:
      POSTGRES_USER: smithy
      POSTGRES_PASSWORD: smithy_dev_password
      POSTGRES_DB: smithy_cloud
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smithy -d smithy_cloud"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    container_name: smithy-cloud-api
    environment:
      DATABASE_URL: postgresql+asyncpg://smithy:smithy_dev_password@postgres:5432/smithy_cloud
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
